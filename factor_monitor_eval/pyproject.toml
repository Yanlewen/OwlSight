[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-monitor-eval"
version = "0.1.0"
description = "Standalone Factor Monitor evaluation providers, scorers, and reports"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
factor-monitor-eval = "factor_monitor_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
