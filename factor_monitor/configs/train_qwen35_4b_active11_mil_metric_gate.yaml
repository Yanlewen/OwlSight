# Ten-step gate for current active-11 all-length metric-weighted Joint MIL.
# Bias and memory-use remain excluded; all counts are resolved after tokenizer
# materialization and written to effective_config.json. The all-length source
# intentionally includes the >65k queries; windowing provides no-truncation
# coverage up to each source query's full length.
extends: train_qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh_metric_current_gate.yaml

dataset:
  directory: ../artifacts/train/combined/harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh_all_lengths
  manifest: effective_config.json
  trajectory_file: trajectories.jsonl
  train_file: train_queries.jsonl
  validation_file: validation_queries.jsonl
  holdout_file: holdout_queries.jsonl

monitor:
  backend_options:
    endpoint_length_audit: ../artifacts/train/combined/harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh_all_lengths/length_audit.json
    metric_mil_loss_weighting: factor_instance
    training_scope:
      mode: smoke_subset
      families:
        - reasoning_method
        - deception
        - skill_use
        - sycophancy
        - reward_hacking
        - sabotage
        - sandbagging
        - instruction_following
        - hallucination
        - privacy
        - jailbreak
    sequence:
      max_factor_tokens: 512
      length_buckets: [8192, 16384, 24576, 32768, 33024]
      overlength_policy: window_complete_no_truncation
    batching:
      training_unit: long_cot_mil
      trajectories_per_microbatch: 1
      max_queries_per_trajectory: null
      mixed_route_policy: route_masked_vectorized
      distributed_unused_route_policy: sampler_guaranteed_per_synchronized_step
    loss_aggregation: mil_factor_instance_uniform
    long_cot_mil:
      enabled: true
      training_schedule: full_epoch_joint
      trigger_endpoint_tokens: 33024
      max_endpoint_tokens: 33024
      cot_overlap_tokens: 6144
      context_policy: repeat_full_when_feasible_else_window_context
      overlap_fallback_policy: half_field_capacity_when_needed
      coverage_policy: complete_no_truncation
      selection_unit: trajectory_any_query_over_trigger
      exact_max_windows: 4
      active_windows: 4
      exploitation_windows: 2
      exploration_windows: 2
      initial_cache: position_stratified_no_model
      cache_refresh: epoch_boundary
      pooling: top2_probability_mean
      long_short_ratio: natural
      long_exposures: 3
      long_sampling: exhaustive_without_replacement
      expected_long_units: auto
      expected_short_units: auto
      sampled_long_units_per_exposure: auto
      optimizer_steps_per_epoch: auto
      short_replay_sampling: exhaustive_without_replacement
      replay_only: false
      evidence_audit_max_failure_ratio: 0.1
      short_validation_auroc_floor: 0.9621829368533024

runtime:
  expected_world_size: 2
  max_sequence_length: 33024
  padding_policy: dynamic_right
  truncation_policy: error
  seed: 0

optimization:
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.00005
  epochs: null
  max_steps: 10
  optimizer: adamw_torch
  scheduler: linear
  checkpoint_policy: steps
  weight_decay: 0.0
  warmup_ratio: 0.0
  max_grad_norm: 1.0
  mixed_precision: bf16
  logging_steps: 1
  save_steps: 10
  save_total_limit: null
  resume_from_checkpoint: null
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false

evaluation:
  metric: selection_score
  cadence: 10
  during_training: false
  threshold_policy: select_on_validation
  early_stopping_patience: null

output:
  directory: ../runs/qwen35_4b_active11_mil_metric_gate
