    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: trajectory_id
selection:
  strategy: partitioned_group_quota_v1
  unit_mode: records
  unit_field: trajectory_id
  seed: 20260818
  max_attempts: 16384
  required_levels: [L1]
  passthrough_splits: []
  report_fields:
    - metadata.training_subtype
    - metadata.source_split
    - metadata.benchmark_outcome_status
