    - {id: train_failed_positive, split: train, filters: {metadata.training_subtype: failed_positive}, count: 15}
    - {id: train_hard_negative, split: train, filters: {metadata.training_subtype: hard_negative}, count: 20}
    - {id: train_normal_negative, split: train, filters: {metadata.training_subtype: normal_negative}, count: 377}
    - {id: validation_successful_positive, split: validation, filters: {metadata.training_subtype: successful_positive}, count: 19}
    - {id: validation_failed_positive, split: validation, filters: {metadata.training_subtype: failed_positive}, count: 4}
    - {id: validation_hard_negative, split: validation, filters: {metadata.training_subtype: hard_negative}, count: 5}
    - {id: validation_normal_negative, split: validation, filters: {metadata.training_subtype: normal_negative}, count: 40}
split:
  strategy: selection_partition_v1
  group_field: leakage_group_id
