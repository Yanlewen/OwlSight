  model: not_applicable_dataset_construction
  tokenizer: not_applicable_pre_tokenization
  decision: preserve_all_675_high_quality_trajectories_with_rare_subtype_90_10_split
  source_path: ../datasets/frontier_risk_internal/reward_hacking/impossiblebench/data/canonical/records.jsonl
  dataset_path: ../datasets/frontier_risk_internal/reward_hacking/impossiblebench/data/canonical/records.jsonl
  source_sha256: 549f3109774f06f2b99cb60ef07ecd169834c7cfd63aae8dc9ebed314ac012f2
  prompt_family: factor_attribution_cot_only_v1
