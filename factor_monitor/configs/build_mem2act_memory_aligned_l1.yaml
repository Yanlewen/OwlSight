schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: mem2act_memory_aligned
    path: ../datasets/capability_internal/memory_use/mem2actbench/data/intermediate/qwen3_8b_memory_contrast_mem2act/matched_decoy/memory_alignment_source_pool.jsonl
    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: factor_pointwise_mix
  unit_field: metadata.factor_instance_id
  seed: 20260829
  max_attempts: 4096
  required_levels: [L1]
  passthrough_splits: []
  coverage:
    - {split: train, field: metadata.qa_id, values: [qa_053, qa_201], minimum_distinct: 250}
    - {split: validation, field: metadata.qa_id, values: [qa_250], minimum_distinct: 50}
    - {split: train, field: metadata.evidence_coverage_id, minimum_distinct: 81}
    - {split: validation, field: metadata.evidence_coverage_id, minimum_distinct: 13}
    - {split: train, field: metadata.hierarchy_coverage_id, minimum_distinct: 101}
    - {split: validation, field: metadata.hierarchy_coverage_id, minimum_distinct: 21}
  report_fields:
    - metadata.composition_role
    - metadata.training_subtype
    - metadata.mem2act_difficulty
    - metadata.factor_scope
    - metadata.negative_mechanism
    - metadata.evidence_coverage_id
    - metadata.hierarchy_coverage_id
  strata:
    - {id: train_factor_hard_gt, split: train, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative, unit.position_relation: positive_gt_negative}, count: 50}
    - {id: train_factor_hard_eq, split: train, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative, unit.position_relation: positions_equal}, count: 32}
    - {id: train_factor_hard_lt, split: train, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative, unit.position_relation: positive_lt_negative}, count: 18}
    - {id: train_factor_distractor, split: train, filters: {unit.composition_role: factor_axis, unit.training_subtype: simple_negative}, count: 50}
    - {id: train_atomic_positive, split: train, filters: {unit.composition_role: pointwise, unit.factor_scope: dependency_atomic, unit.training_subtype: positive}, count: 150}
    - {id: train_atomic_hard, split: train, filters: {unit.composition_role: pointwise, unit.factor_scope: dependency_atomic, unit.training_subtype: hard_negative}, count: 100}
    - {id: train_atomic_absent, split: train, filters: {unit.composition_role: pointwise, unit.factor_scope: dependency_atomic, unit.training_subtype: simple_negative}, count: 50}
    - {id: train_complete_positive, split: train, filters: {unit.composition_role: pointwise, unit.factor_scope: task_complete, unit.training_subtype: positive}, count: 200}
    - {id: train_complete_partial, split: train, filters: {unit.composition_role: pointwise, unit.factor_scope: task_complete, unit.training_subtype: hard_negative, unit.negative_mechanism: partial_task_failure}, count: 69}
    - {id: train_complete_failure, split: train, filters: {unit.composition_role: pointwise, unit.factor_scope: task_complete, unit.training_subtype: hard_negative, unit.negative_mechanism: complete_task_failure}, count: 131}
    - {id: validation_factor_hard_gt, split: validation, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative, unit.position_relation: positive_gt_negative}, count: 13}
    - {id: validation_factor_hard_eq, split: validation, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative, unit.position_relation: positions_equal}, count: 4}
    - {id: validation_factor_hard_lt, split: validation, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative, unit.position_relation: positive_lt_negative}, count: 3}
    - {id: validation_factor_distractor, split: validation, filters: {unit.composition_role: factor_axis, unit.training_subtype: simple_negative}, count: 10}
    - {id: validation_atomic_positive, split: validation, filters: {unit.composition_role: pointwise, unit.factor_scope: dependency_atomic, unit.training_subtype: positive}, count: 30}
    - {id: validation_atomic_hard, split: validation, filters: {unit.composition_role: pointwise, unit.factor_scope: dependency_atomic, unit.training_subtype: hard_negative}, count: 20}
    - {id: validation_atomic_absent, split: validation, filters: {unit.composition_role: pointwise, unit.factor_scope: dependency_atomic, unit.training_subtype: simple_negative}, count: 10}
    - {id: validation_complete_positive, split: validation, filters: {unit.composition_role: pointwise, unit.factor_scope: task_complete, unit.training_subtype: positive}, count: 40}
    - {id: validation_complete_partial, split: validation, filters: {unit.composition_role: pointwise, unit.factor_scope: task_complete, unit.training_subtype: hard_negative, unit.negative_mechanism: partial_task_failure}, count: 14}
    - {id: validation_complete_failure, split: validation, filters: {unit.composition_role: pointwise, unit.factor_scope: task_complete, unit.training_subtype: hard_negative, unit.negative_mechanism: complete_task_failure}, count: 26}

split:
  strategy: selection_partition_v1
  group_field: leakage_group_id

provenance:
  purpose: symmetric_dual_axis_atomic_task_complete_memory_training
  source_processing_config: ../datasets/capability_internal/memory_use/mem2actbench/processing/qwen3_8b_memory_contrast_mem2act.yaml
  dataset_path: ../datasets/capability_internal/memory_use/mem2actbench/data/intermediate/qwen3_8b_memory_contrast_mem2act/matched_decoy/memory_alignment_source_pool.jsonl
  model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  tokenizer: ../runs/qwen35_4b_factor_binary_phase1_endpoint/model_bundle/tokenizer
  split: source_component_group_disjoint_train_1000_validation_200
  max_sequence_length: 32768_evidence_plus_512_factor
  truncation: prohibited_fail_closed
  padding: not_applicable_dataset_artifact
  batch_size: not_applicable_dataset_construction
  learning_rate: not_applicable_dataset_construction
  epochs_or_steps: one_deterministic_build_pass
  optimizer: not_applicable_dataset_construction
  scheduler: not_applicable_dataset_construction
  seed: 20260829
  evaluation_metric: binary_factor_conditioned_memory_application_atomic_and_task_complete

output:
  directory: ../artifacts/train/memory/relational/mem2act_memory_aligned_l1
