schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: truthfulqa_hallucination
    path: ../datasets/trustworthiness_internal/hallucination/truthfulqa/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id
  - mixture_id: bbq_bias
    path: ../datasets/trustworthiness_internal/bias/bbq/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id
  - mixture_id: privacylens_privacy
    path: ../datasets/trustworthiness_internal/privacy/privacylens/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id
  - mixture_id: wildjailbreak_jailbreak
    path: ../datasets/trustworthiness_external/jailbreak/wildjailbreak/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id

split:
  strategy: metadata_partition_v1
  field: metadata.source_partition
  train_value: train
  validation_value: validation
  holdout_value: holdout

provenance:
  dataset_id: trustworthiness4
  purpose: four_new_trustworthiness_family_training_component
  source_selection: complete_group_balanced_train_validation
  source_review: Codex_manual_semantic_review_not_human_gold
  model: DeepSeek-R1-0528-Qwen3-8B upstream rollout generator
  tokenizer: ../runs/qwen35_4b_factor_binary_phase1_endpoint/model_bundle/tokenizer
  split: source_owned_group_disjoint_approximately_five_to_one
  max_sequence_length: 32768_evidence_plus_512_factor_before_partition
  truncation: prohibited_fail_closed
  padding: dynamic_right_at_training
  batch_size: inherited_by_training_config
  learning_rate: inherited_by_training_config
  epochs_or_steps: inherited_by_training_config
  seed: 20260901
  evaluation_metric: gmean2_formal_auroc_auprc_diagnostic
  monitor_input: task_context_plus_complete_cot_plus_factor
  model_output: diagnostic_only

output:
  directory: ../artifacts/train/combined/trustworthiness4
