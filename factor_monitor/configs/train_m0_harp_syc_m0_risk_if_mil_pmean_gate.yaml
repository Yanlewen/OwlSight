# Ten-step integration gate for long-CoT MIL with Top-2 probability mean.
extends: train_m0_harp_syc_m0_risk_if_factor_suffix_gate.yaml

dataset:
  directory: ../artifacts/train/combined/harp_syc_m0_risk_if_all_lengths
  manifest: effective_config.json
  trajectory_file: trajectories.jsonl
  train_file: train_queries.jsonl
  validation_file: validation_queries.jsonl
  holdout_file: holdout_queries.jsonl

initialization:
  model_bundle: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_factor_suffix/model_bundle
  policy: weights_only_fresh_optimizer

monitor:
  backend_options:
    endpoint_length_audit: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_mil_length.json
    new_module_learning_rate: 0.00001
    sequence:
      max_factor_tokens: 512
      length_buckets: [8192, 16384, 24576, 32768, 33024]
      overlength_policy: window_complete_no_truncation
    batching:
      training_unit: long_cot_mil
      trajectories_per_microbatch: 1
      max_queries_per_trajectory: null
      mixed_route_policy: route_masked_vectorized
      distributed_unused_route_policy: sampler_guaranteed_per_synchronized_step
    loss_aggregation: mil_factor_instance_uniform
    long_cot_mil:
      enabled: true
      trigger_endpoint_tokens: 33024
      max_endpoint_tokens: 33024
      cot_overlap_tokens: 6144
      context_policy: repeat_full_when_feasible_else_window_context
      overlap_fallback_policy: half_field_capacity_when_needed
      coverage_policy: complete_no_truncation
      selection_unit: trajectory_any_query_over_trigger
      exact_max_windows: 4
      active_windows: 4
      exploitation_windows: 2
      exploration_windows: 2
      initial_cache: warm_start_full_no_grad
      cache_refresh: every_long_exposure
      pooling: top2_probability_mean
      long_short_ratio: "1:1"
      long_exposures: 1
      long_sampling: shuffled_without_replacement_pad_to_288
      expected_long_units: 286
      sampled_long_units_per_exposure: 288
      short_replay_sampling: nine_family_uniform
      replay_only: false
      evidence_audit_max_failure_ratio: 0.1
      short_validation_auroc_floor: 0.9621829368533024

runtime:
  expected_world_size: 1
  max_sequence_length: 33024

optimization:
  resume_from_checkpoint: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_mil_pmean_gate/checkpoint-10
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.00001
  max_steps: 10
  warmup_ratio: 0.0
  logging_steps: 1
  save_steps: 10

evaluation:
  metric: selection_score
  cadence: 10

output:
  directory: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_mil_pmean_gate
