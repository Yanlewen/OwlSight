# Metric-weighted Factor-sensitivity diagnostic on the held-out SRA skill-use contrast.
extends: eval_run_phase1_m0_base.yaml

dataset:
  directory: ../artifacts/train/skill/sra_bench_skill_use_contrast
  trajectory_file: trajectories.jsonl
  query_file: validation_queries.jsonl

monitor:
  backend_options:
    endpoint_encoding_contract_id: endpoint_factor_suffix_contract_v1
    endpoint_length_audit: ../artifacts/eval/factor_sensitivity_audits/skill_sra_bench_use_contrast.json
    evaluation_scope:
      mode: diagnostic
      factor_interventions: [matched, shuffled, constant]
      mixed_labels_only: true
      intervention_seed: 0
      native_checkpoint_threshold: 0.012821214266594244

evaluation:
  metric: auroc

output:
  directory: ../runs/eval/metric_weighted_factor_sensitivity_32768/skill_use
