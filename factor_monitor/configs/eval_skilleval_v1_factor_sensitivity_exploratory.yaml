schema_version: 1
kind: eval_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: skilleval_v1_factor_sensitivity_exploratory
    path: ../datasets/capability_internal/skill_use/skilleval_v1/data/intermediate/factor_sensitivity_exploratory/records.jsonl
    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id

evaluation:
  benchmark: skilleval_v1_factor_sensitivity_exploratory
  metric_adapter: within_trajectory_l1_target_contrast

output:
  directory: ../artifacts/eval/skill/skilleval_v1/factor_sensitivity_exploratory
