schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: science_mcq_te_l3
    path: ../datasets/frontier_risk_external/sycophancy/science_mcq_te/data/canonical/records.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0
  - mixture_id: moral_stories_independent_te_l3
    path: ../datasets/frontier_risk_external/sycophancy/moral_stories_independent_te/data/canonical/records.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: records
  unit_field: metadata.source_record_id
  seed: 20260818
  max_attempts: 4096
  required_levels: [L3]
  passthrough_splits: []
  preferred_unit_files:
    - split: train
      path: ../artifacts/train/sycophancy/science_mcq_moral_contrast_l1/train_queries.jsonl
      field: metadata.source_record_id
    - split: validation
      path: ../artifacts/train/sycophancy/science_mcq_moral_contrast_l1/validation_queries.jsonl
      field: metadata.source_record_id
  report_fields:
    - metadata.source_component
    - metadata.intervention.cue_style
    - metadata.causal.training_role
    - metadata.original_source_partition
  coverage:
