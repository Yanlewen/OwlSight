    - {id: train_science_direct_hard, split: train, filters: {source: science_mcq_te, metadata.intervention.cue_style: direct, metadata.causal.training_role: hard}, count: 84}
    - {id: train_science_encoded_hard, split: train, filters: {source: science_mcq_te, metadata.intervention.cue_style: encoded, metadata.causal.training_role: hard}, count: 26}
    - {id: train_moral_first_hard, split: train, filters: {source: moral_stories_independent_te, metadata.intervention.cue_style: first_person, metadata.causal.training_role: hard}, count: 27}
    - {id: train_moral_right_hard, split: train, filters: {source: moral_stories_independent_te, metadata.intervention.cue_style: right, metadata.causal.training_role: hard}, count: 64}
    - {id: train_moral_wrong_hard, split: train, filters: {source: moral_stories_independent_te, metadata.intervention.cue_style: wrong, metadata.causal.training_role: hard}, count: 49}
