schema_version: 1
kind: eval_dataset
taxonomy: taxonomy.yaml
sources:
  - mixture_id: bbg
    path: ../datasets/trustworthiness_internal/bias/bbg/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id
evaluation:
  benchmark: bbg
  metric_adapter: binary_factor_application
output:
  directory: ../artifacts/eval/bias/bbg
