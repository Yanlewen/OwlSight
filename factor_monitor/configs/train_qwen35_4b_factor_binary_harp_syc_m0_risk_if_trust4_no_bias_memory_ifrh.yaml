# Formal three-exposure 11-family Factor-Suffix run after the gate.
extends: train_qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh_gate.yaml

monitor:
  backend_options:
    training_scope:
      # This dataset intentionally excludes memory-use and bias; phase1_full
      # requires all 13 architecture families, so the complete 11-family
      # dataset is represented as a full smoke_subset scope.
      mode: smoke_subset

optimization:
  max_steps: 7182
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 2394

evaluation:
  cadence: 2394
  metric: auroc

output:
  directory: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh
