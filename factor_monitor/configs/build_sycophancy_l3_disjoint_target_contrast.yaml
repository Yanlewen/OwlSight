schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: sycophancy_science_l3_disjoint
    path: ../datasets/frontier_risk_external/sycophancy/science/data/canonical/records.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.causal.triplet_group_id
  - mixture_id: sycophancy_mmlu_pro_l3_disjoint
    path: ../datasets/frontier_risk_external/sycophancy/mmlu_pro/data/canonical/records.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.causal.triplet_group_id
  - mixture_id: sycophancy_cybermetric_l3_disjoint
    path: ../datasets/frontier_risk_external/sycophancy/cybermetric/data/canonical/records.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.causal.triplet_group_id
  - mixture_id: sycophancy_moral_stories_l3_disjoint
    path: ../datasets/frontier_risk_external/sycophancy/moral_stories/data/canonical/records.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.causal.triplet_group_id

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: sycophancy_pair
  unit_field: metadata.causal.triplet_group_id
  seed: 20260818
  max_attempts: 4096
  required_levels: [L3]
  passthrough_splits: []
  report_fields:
    - metadata.source_partition
  coverage: []
  exclude_overlap_query_files:
    - ../artifacts/train/sycophancy/intervention_target_contrast_l1/train_queries.jsonl
    - ../artifacts/train/sycophancy/intervention_target_contrast_l1/validation_queries.jsonl
  strata:
    - {id: train_mmlu, split: train, filters: {source: mmlu_pro}, count: 86}
    - {id: train_moral, split: train, filters: {source: moral_stories}, count: 109}
    - {id: train_cyber, split: train, filters: {source: cybermetric}, count: 35}
    - {id: train_science, split: train, filters: {source: science}, count: 20}
    - {id: validation_mmlu, split: validation, filters: {source: mmlu_pro}, count: 12}
    - {id: validation_moral, split: validation, filters: {source: moral_stories}, count: 7}
    - {id: validation_cyber, split: validation, filters: {source: cybermetric}, count: 1}
    - {id: validation_science, split: validation, filters: {source: science}, count: 2}

split:
  strategy: metadata_partition_v1
  field: metadata.source_partition
  train_value: train
  validation_value: validation
  holdout_value: holdout

provenance:
  purpose: preserve_sycophancy_l3_weight_without_contrast_overlap
  contrast_owner: intervention_target_contrast_l1
  overlap_policy:
    fields: [trajectory_id, leakage_group_id]
    action: exclude
  source_quota_basis: all_available_disjoint_causal_pairs_by_source_split
  level: L3
  truncation: none
  seed: 20260818

output:
  directory: ../artifacts/train/sycophancy/intervention_l3_disjoint_target_contrast
