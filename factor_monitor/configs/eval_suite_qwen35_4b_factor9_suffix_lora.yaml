# Existing 13-unit nine-family suite for the direct A/B SFT LoRA adapter.
extends: eval_suite_qwen35_4b_zero_shot_factor9_suffix.yaml

model:
  adapter:
    path: ../runs/qwen35_4b_factor_binary_factor9_suffix_lora/model_bundle/backbone
    name: factor9-choice-sft
    id: 1
    rank: 16

runtime:
