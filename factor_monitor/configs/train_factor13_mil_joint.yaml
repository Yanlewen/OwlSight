# Three-epoch thirteen-family Joint MIL baseline on all currently available data.
# The frozen nine-family all-length source is extended with four short-only
# trustworthiness families; no refreshed Reward Hacking data is included.
extends: train_m0_harp_syc_m0_risk_if_mil_joint_pmean.yaml

dataset:
  directory: ../artifacts/train/combined/harp_syc_m0_risk_if_trust4_all_lengths
  manifest: effective_config.json
  trajectory_file: trajectories.jsonl
  train_file: train_queries.jsonl
  validation_file: validation_queries.jsonl
  holdout_file: holdout_queries.jsonl

monitor:
  backend_options:
    architecture_config: architecture_factor_monitor_trustworthiness13.yaml
    endpoint_length_audit: ../runs/qwen35_4b_factor13_mil_joint_length.json
    evidence_routes:
      hallucination: context_grounded
      bias: context_grounded
      privacy: context_grounded
      jailbreak: context_grounded
    training_scope:
      mode: phase1_full
      families:
        - reasoning_method
        - deception
        - memory_use
        - skill_use
        - sycophancy
        - reward_hacking
        - sabotage
        - sandbagging
        - instruction_following
        - hallucination
        - bias
        - privacy
        - jailbreak
    long_cot_mil:
      expected_long_units: 286
      expected_short_units: 8807
      sampled_long_units_per_exposure: 286
      optimizer_steps_per_epoch: 2274

optimization:
  save_steps: 2274

evaluation:
  cadence: 2274

output:
  directory: ../runs/qwen35_4b_factor13_mil_joint
