schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: mem2act_memory_relational
    path: ../datasets/capability_internal/memory_use/mem2actbench/data/intermediate/qwen3_8b_memory_contrast_mem2act/matched_decoy/relational_source_pool.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: factor_pointwise_mix
  unit_field: metadata.factor_instance_id
  seed: 20260827
  max_attempts: 512
  required_levels: [L3]
  passthrough_splits: []
  coverage: []
  report_fields:
    - metadata.composition_role
    - metadata.training_subtype
    - metadata.mem2act_difficulty
    - metadata.factor_scope
  strata:
    - {id: train_pair_hard, split: train, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative}, count: 100}
    - {id: train_pair_simple, split: train, filters: {unit.composition_role: factor_axis, unit.training_subtype: simple_negative}, count: 150}
    - {id: train_point_positive, split: train, filters: {unit.composition_role: pointwise, unit.training_subtype: positive}, count: 250}
    - {id: train_point_hard, split: train, filters: {unit.composition_role: pointwise, unit.training_subtype: hard_negative}, count: 233}
    - {id: train_point_simple, split: train, filters: {unit.composition_role: pointwise, unit.training_subtype: simple_negative}, count: 17}
    - {id: validation_pair_hard, split: validation, filters: {unit.composition_role: factor_axis, unit.training_subtype: hard_negative}, count: 20}
    - {id: validation_pair_simple, split: validation, filters: {unit.composition_role: factor_axis, unit.training_subtype: simple_negative}, count: 30}
    - {id: validation_point_positive, split: validation, filters: {unit.composition_role: pointwise, unit.training_subtype: positive}, count: 50}
    - {id: validation_point_hard, split: validation, filters: {unit.composition_role: pointwise, unit.training_subtype: hard_negative}, count: 47}
    - {id: validation_point_simple, split: validation, filters: {unit.composition_role: pointwise, unit.training_subtype: simple_negative}, count: 3}

split:
  strategy: selection_partition_v1
  group_field: leakage_group_id

provenance:
  source_processing_config: ../datasets/capability_internal/memory_use/mem2actbench/processing/qwen3_8b_memory_contrast_mem2act.yaml
  dataset_path: ../datasets/capability_internal/memory_use/mem2actbench/data/intermediate/qwen3_8b_memory_contrast_mem2act/matched_decoy/relational_source_pool.jsonl
  model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  tokenizer: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  split: train_validation_group_disjoint
  max_sequence_length: 65536_full_source_context
  truncation: prohibited
  padding: not_applicable_dataset_artifact
  batch_size: not_applicable_dataset_construction
  learning_rate: not_applicable_dataset_construction
  epochs_or_steps: one_deterministic_build_pass
  optimizer: not_applicable_dataset_construction
  scheduler: not_applicable_dataset_construction
  seed: 20260827
  evaluation_metric: binary_atomic_memory_application

output:
  directory: ../artifacts/train/memory/relational/mem2act_memory_relational_l3
