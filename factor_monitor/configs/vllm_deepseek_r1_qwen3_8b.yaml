schema_version: 1
kind: factor_vllm_runtime

server:
  model: ${BASE_MODEL_ROOT}/models--deepseek-ai--DeepSeek-R1-0528-Qwen3-8B
  served_model_name: ${BASE_MODEL_ROOT}/models--deepseek-ai--DeepSeek-R1-0528-Qwen3-8B
  reasoning_parser: qwen3
  tool_call_parser: qwen3_xml
  enable_auto_tool_choice: true
  tensor_parallel_size: 1
  max_model_len: 65536
  gpu_memory_utilization: 0.9
  port: 8000
  enable_prefix_caching: true
  trust_remote_code: true
  startup_timeout_seconds: 2400

cluster:
  gpu: 1
  cpu: 8
  memory_mb: 128000
  namespace: ailab-ai4good2
  charged_group: ai4good2_gpu
  private_machine: group
  image: registry.h.pjlab.org.cn/ailab/vllm:cu128-nightly-260309-b0906d8b02681d8d8f0709f0cc730f5fe845b5b1
  host_network: false
  mounts:
    - gpfs://gpfs1/anonymous:${PRIVATE_STORAGE_ROOT}
    - ${SHARED_STORAGE_URI}:${SHARED_STORAGE_ROOT}

python:
  executable: /bin/python3
  packages:
    - distribution: transformers
      import: transformers
      version: 4.57.6
    - distribution: tokenizers
      import: tokenizers
      version: 0.22.2
    - distribution: PyYAML
      import: yaml
    - distribution: openai
      import: openai
    - distribution: tqdm
      import: tqdm
    - distribution: pandas
      import: pandas
    - distribution: tiktoken
      import: tiktoken
    - distribution: rank-bm25
      import: rank_bm25
