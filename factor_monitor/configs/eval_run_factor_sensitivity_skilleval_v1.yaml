# Exploratory same-CoT L1 SkillEval Factor target-swap diagnostic.
extends: eval_run_phase1_m0_base.yaml

dataset:
  directory: ../artifacts/eval/skill/skilleval_v1/factor_sensitivity_exploratory
  trajectory_file: trajectories.jsonl
  query_file: eval_queries.jsonl

monitor:
  backend_options:
    architecture_config: architecture_factor_monitor_trustworthiness13.yaml
    evidence_routes:
      reasoning_method: cot_direct
      deception: cot_direct
      memory_use: context_grounded
      skill_use: context_grounded
      sycophancy: context_grounded
      reward_hacking: cot_direct
      sabotage: cot_direct
      sandbagging: context_grounded
      instruction_following: context_grounded
      hallucination: context_grounded
      bias: context_grounded
      privacy: context_grounded
      jailbreak: context_grounded
    endpoint_encoding_contract_id: endpoint_factor_suffix_contract_v1
    endpoint_length_audit: ../artifacts/eval/skill/skilleval_v1/factor_sensitivity_exploratory/length_audit.json
    model_bundle: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh_metric_weighted/checkpoint-4788/model_bundle
    evaluation_scope:
      mode: diagnostic
      factor_interventions: [matched, shuffled, constant]
      mixed_labels_only: true
      intervention_seed: 0
      native_checkpoint_threshold: 0.012821214266594244

runtime:
  max_sequence_length: 98304
  truncation_policy: error
  padding_policy: dynamic_right
  seed: 0
  batch_size: 1

evaluation:
  metric: auroc
  threshold_policy: frozen_validation
  threshold_source: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh_metric_weighted/validation_threshold.json

output:
  directory: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_ifrh_metric_weighted/factor_sensitivity/skilleval_exploratory
