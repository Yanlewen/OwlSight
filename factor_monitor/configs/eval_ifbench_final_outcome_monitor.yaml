schema_version: 1
kind: eval_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: ifbench_official_test_outcome
    path: ../artifacts/eval/instruction_following/ifbench_official_test_outcome/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_id

evaluation:
  benchmark: ifbench_official_test_outcome
  metric_adapter: binary_factor_application

output:
  directory: ../artifacts/eval/instruction_following/ifbench_official_test_outcome/monitor_manifest
