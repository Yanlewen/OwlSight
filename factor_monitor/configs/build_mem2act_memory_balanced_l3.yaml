schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml
sources:
  - mixture_id: mem2act_memory_balanced
    path: ../datasets/capability_internal/memory_use/mem2actbench/data/canonical/records.jsonl
    include_levels: [L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: trajectory_id
selection:
  strategy: partitioned_group_quota_v1
  unit_mode: mem2act_pair
  unit_field: trajectory_id
  seed: 20260818
  max_attempts: 4096
  required_levels: [L3]
  passthrough_splits: []
  report_fields:
    - metadata.training_subtype
    - metadata.mem2act_difficulty
    - metadata.request_seed
    - metadata.control_pairing
  coverage: []
  strata:
    - {id: train_positive_l1, split: train, filters: {unit.role: positive, metadata.mem2act_difficulty: L1}, count: 362}
    - {id: train_positive_l2, split: train, filters: {unit.role: positive, metadata.mem2act_difficulty: L2}, count: 77}
    - {id: train_positive_l3, split: train, filters: {unit.role: positive, metadata.mem2act_difficulty: L3}, count: 12}
    - {id: train_positive_l4, split: train, filters: {unit.role: positive, metadata.mem2act_difficulty: L4}, count: 49}
    - {id: train_pair_l1, split: train, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L1}, count: 113}
    - {id: train_pair_l2, split: train, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L2}, count: 93}
    - {id: train_pair_l3, split: train, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L3}, count: 17}
    - {id: train_pair_l4, split: train, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L4}, count: 27}
    - {id: validation_positive_l1, split: validation, filters: {unit.role: positive, metadata.mem2act_difficulty: L1}, count: 73}
    - {id: validation_positive_l2, split: validation, filters: {unit.role: positive, metadata.mem2act_difficulty: L2}, count: 15}
    - {id: validation_positive_l3, split: validation, filters: {unit.role: positive, metadata.mem2act_difficulty: L3}, count: 2}
    - {id: validation_positive_l4, split: validation, filters: {unit.role: positive, metadata.mem2act_difficulty: L4}, count: 10}
    - {id: validation_pair_l1, split: validation, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L1}, count: 23}
    - {id: validation_pair_l2, split: validation, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L2}, count: 18}
    - {id: validation_pair_l3, split: validation, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L3}, count: 4}
    - {id: validation_pair_l4, split: validation, filters: {unit.role: negative_pair, metadata.mem2act_difficulty: L4}, count: 5}
split:
  strategy: selection_partition_v1
  group_field: leakage_group_id
provenance:
  dataset_path: ../datasets/capability_internal/memory_use/mem2actbench/data/canonical/records.jsonl
  model: not_applicable_dataset_construction
  tokenizer: not_applicable_pre_tokenization
  split: leakage_group_disjoint_matched_pair
  max_sequence_length: unbounded_complete_cot
  truncation: none
  padding: not_applicable_dataset_artifact
  batch_size: not_applicable_dataset_construction
  learning_rate: not_applicable_dataset_construction
  epochs_or_steps: not_applicable_dataset_construction
  optimizer: not_applicable_dataset_construction
  scheduler: not_applicable_dataset_construction
  seed: 20260818
  evaluation_metric: binary_memory_application

output:
  directory: ../artifacts/train/memory/balance/mem2act_memory_balanced_l3
