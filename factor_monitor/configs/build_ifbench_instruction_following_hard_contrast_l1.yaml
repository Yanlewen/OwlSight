schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: ifbench_ifrlvr_single_turn
    path: ../datasets/capability_external/instruction_following/ifbench/data/canonical/runs/ifrlvr_train/records.jsonl
    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: trajectory_id
  - mixture_id: ifbench_ifrlvr_rewrite
    path: ../datasets/capability_external/instruction_following/ifbench/data/canonical/runs/ifrlvr_rewrite_train/records.jsonl
    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: trajectory_id

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: records
  unit_field: trajectory_id
  seed: 20260818
  max_attempts: 4096
  required_levels: [L1]
  passthrough_splits: []
  report_fields:
    - metadata.condition
    - metadata.constraint_count
    - metadata.cot_evidence_stage
    - metadata.official_constraint_categories
  coverage: []
  strata:
    # Train positive: 375 single-turn + 125 rewrite; 250 single + 250 multiple.
    - {id: tr_pos_st_single, split: train, filters: {label: 1, metadata.condition: constrained, unit.constraint_cardinality: single}, count: 188}
    - {id: tr_pos_st_multiple, split: train, filters: {label: 1, metadata.condition: constrained, unit.constraint_cardinality: multiple}, count: 187}
    - {id: tr_pos_rw_single, split: train, filters: {label: 1, metadata.condition: constrained_rewrite, unit.constraint_cardinality: single}, count: 62}
    - {id: tr_pos_rw_multiple, split: train, filters: {label: 1, metadata.condition: constrained_rewrite, unit.constraint_cardinality: multiple}, count: 63}
    # Train simple negatives: 25 single + 25 multiple.
    - {id: tr_simple_single, split: train, filters: {label: 0, metadata.condition: no_instruction, unit.constraint_cardinality: single}, count: 25}
    - {id: tr_simple_multiple, split: train, filters: {label: 0, metadata.condition: no_instruction, unit.constraint_cardinality: multiple}, count: 25}
    # Train hard negatives: 325 single-turn + 125 rewrite; stage totals 300/40/80/30.
    - {id: tr_hard_st_single_plan, split: train, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: planned_only}, count: 44}
    - {id: tr_hard_st_single_partial, split: train, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: partially_operationalized}, count: 9}
    - {id: tr_hard_st_single_notice, split: train, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: noticed_only}, count: 80}
    - {id: tr_hard_st_single_none, split: train, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: no_constraint_evidence}, count: 30}
    - {id: tr_hard_st_multiple_plan, split: train, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: planned_only}, count: 150}
    - {id: tr_hard_st_multiple_partial, split: train, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: partially_operationalized}, count: 12}
    - {id: tr_hard_rw_single_plan, split: train, filters: {label: 0, metadata.condition: constrained_rewrite, unit.constraint_cardinality: single, metadata.cot_evidence_stage: planned_only}, count: 62}
    - {id: tr_hard_rw_multiple_plan, split: train, filters: {label: 0, metadata.condition: constrained_rewrite, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: planned_only}, count: 44}
    - {id: tr_hard_rw_multiple_partial, split: train, filters: {label: 0, metadata.condition: constrained_rewrite, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: partially_operationalized}, count: 19}

    # Validation: exact 100 positive / 10 simple / 90 hard and 25% rewrite.
    - {id: va_pos_st_single, split: validation, filters: {label: 1, metadata.condition: constrained, unit.constraint_cardinality: single}, count: 38}
    - {id: va_pos_st_multiple, split: validation, filters: {label: 1, metadata.condition: constrained, unit.constraint_cardinality: multiple}, count: 37}
    - {id: va_pos_rw_single, split: validation, filters: {label: 1, metadata.condition: constrained_rewrite, unit.constraint_cardinality: single}, count: 12}
    - {id: va_pos_rw_multiple, split: validation, filters: {label: 1, metadata.condition: constrained_rewrite, unit.constraint_cardinality: multiple}, count: 13}
    - {id: va_simple_single, split: validation, filters: {label: 0, metadata.condition: no_instruction, unit.constraint_cardinality: single}, count: 5}
    - {id: va_simple_multiple, split: validation, filters: {label: 0, metadata.condition: no_instruction, unit.constraint_cardinality: multiple}, count: 5}
    - {id: va_hard_st_single_plan, split: validation, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: planned_only}, count: 11}
    - {id: va_hard_st_single_partial, split: validation, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: partially_operationalized}, count: 2}
    - {id: va_hard_st_single_notice, split: validation, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: noticed_only}, count: 15}
    - {id: va_hard_st_single_none, split: validation, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: single, metadata.cot_evidence_stage: no_constraint_evidence}, count: 5}
    - {id: va_hard_st_multiple_plan, split: validation, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: planned_only}, count: 26}
    - {id: va_hard_st_multiple_partial, split: validation, filters: {label: 0, metadata.condition: constrained, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: partially_operationalized}, count: 6}
    - {id: va_hard_rw_single_plan, split: validation, filters: {label: 0, metadata.condition: constrained_rewrite, unit.constraint_cardinality: single, metadata.cot_evidence_stage: planned_only}, count: 12}
    - {id: va_hard_rw_multiple_plan, split: validation, filters: {label: 0, metadata.condition: constrained_rewrite, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: planned_only}, count: 11}
    - {id: va_hard_rw_multiple_partial, split: validation, filters: {label: 0, metadata.condition: constrained_rewrite, unit.constraint_cardinality: multiple, metadata.cot_evidence_stage: partially_operationalized}, count: 2}

split:
  strategy: selection_partition_v1
  group_field: leakage_group_id

provenance:
  dataset_id: ifbench_instruction_following_hard_contrast
  split: leakage_group_disjoint_train_validation
  source_datasets: [allenai/IF_multi_constraints_upto5]
  source_selection_seed: 20260813
  seed: 20260818
  generator_model: ${BASE_MODEL_ROOT}/models--deepseek-ai--DeepSeek-R1-0528-Qwen3-8B
  tokenizer: ${BASE_MODEL_ROOT}/models--deepseek-ai--DeepSeek-R1-0528-Qwen3-8B
  generation_max_tokens: 16384
  monitor_max_sequence_length: 33024
  truncation_policy: error
  padding_policy: dynamic_right_at_training
  batch_size: inherited_by_training_config
  learning_rate: inherited_by_training_config
  epochs_or_steps: inherited_by_training_config
  evaluation_metric: binary_cot_instruction_operationalization
  monitor_input: task_context_plus_complete_cot_visible_final_excluded
  official_test_used_for_training: false
  ratio_constraints_added: false

output:
  directory: ../artifacts/train/instruction_following/hard_contrast/ifbench_instruction_following_l1
