schema_version: 1
kind: factor_judge_profile
profile_id: glm_5_3_thinking_low
model: glm-5.3

request:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192
  extra_body:
    reasoning_effort: low

transport:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  workers: 8
  retries: 1
  timeout_seconds: 600
  checkpoint_every: 1

response:
  require_content: true
  forbid_reasoning: false
