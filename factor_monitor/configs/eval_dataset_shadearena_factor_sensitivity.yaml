schema_version: 1
kind: eval_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: shadearena_factor_sensitivity
    path: ../datasets/frontier_risk_internal/sabotage/controlarena/data/intermediate/factor_sensitivity/records.jsonl
    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id

evaluation:
  benchmark: shadearena_factor_sensitivity
  metric_adapter: within_trajectory_l1_target_contrast

output:
  directory: ../artifacts/eval/sabotage/shadearena_factor_sensitivity
