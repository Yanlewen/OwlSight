schema_version: 1
kind: train_composite_dataset

components:
  - component_id: reasoning_harp_contrast
    directory: ../artifacts/train/process/method_application_harp_contrast
    split_selection:
      train: {}
      validation: {}
  - component_id: sycophancy_target_contrast_l1
    directory: ../artifacts/train/sycophancy/intervention_target_contrast_l1
    split_selection:
      train: {}
      validation: {}
  - component_id: baseline_unchanged_families
    directory: ../artifacts/train/phase1/phase1_accepted
    split_selection:
      train:
        include_families: [deception, memory_use, skill_use]
      validation:
        include_families: [deception, memory_use, skill_use]
  - component_id: sycophancy_l3_disjoint
    directory: ../artifacts/train/sycophancy/intervention_l3_disjoint_target_contrast
    split_selection:
      train: {}
      validation: {}
  - component_id: baseline_holdout_unchanged
    directory: ../artifacts/train/phase1/phase1_accepted
    split_selection:
      holdout: {}

factor_instance_level_sets:
  - [L1]
  - [L3]
  - [L1, L3]

required_families:
  - reasoning_method
  - deception
  - memory_use
  - skill_use
  - sycophancy

provenance:
  purpose: m0_same_trajectory_contrast_data_test
  baseline: qwen35_4b_factor_binary_phase1_endpoint
  intended_delta:
    reasoning_method: replace_train_validation_with_harp_factor_contrast
    sycophancy_l1: replace_with_target_contrast
    sycophancy_l3: reselect_all_available_causal_pairs_disjoint_from_target_contrast
  overlap_policy:
    fields: [trajectory_id, leakage_group_id]
    scope: same_split_new_contrast_vs_retained_baseline
    action: exclude_retained_baseline_row
  unchanged_families: [deception, memory_use, skill_use]
  holdout: inherited_unchanged_from_phase1_accepted
  sampler_family_weighting: inherited_family_uniform
  truncation: none
  seed: 20260818

output:
  directory: ../artifacts/train/phase1/phase1_harp_syc_target_contrast
