# Ten-step two-H200 integration gate for nine-family Factor-Suffix training.
extends: train_m0_harp_syc_pair_m0_rest_factor_suffix_screen.yaml

dataset:
  directory: ../artifacts/train/combined/harp_syc_m0_risk_if
  manifest: effective_config.json
  trajectory_file: trajectories.jsonl
  train_file: train_queries.jsonl
  validation_file: validation_queries.jsonl
  holdout_file: holdout_queries.jsonl

monitor:
  backend_options:
    architecture_config: architecture_factor_monitor_nine_family.yaml
    endpoint_length_audit: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_factor_suffix_length.json
    evidence_routes:
      reward_hacking: cot_direct
      sabotage: cot_direct
      sandbagging: context_grounded
      instruction_following: context_grounded
    label_weighting: record_loss_weight
    training_scope:
      mode: engineering_full_smoke
      families:
        - reasoning_method
        - deception
        - memory_use
        - skill_use
        - sycophancy
        - reward_hacking
        - sabotage
        - sandbagging
        - instruction_following

optimization:
  max_steps: 10
  warmup_ratio: 0.0
  logging_steps: 1
  save_steps: 10

evaluation:
  cadence: 10

output:
  directory: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_factor_suffix_gate
