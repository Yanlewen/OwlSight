schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: sra_bench_skill_use
    path: ../datasets/capability_internal/skill_use/sra_bench/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: records
  unit_field: metadata.factor_instance_id
  seed: 20260818
  max_attempts: 16384
  required_levels: [L1, L3]
  passthrough_splits: []
  report_fields:
    - metadata.benchmark_source
    - metadata.factor_scope
    - metadata.condition
    - metadata.negative_type
    - metadata.task_correct
  coverage: []
  strata:
    # Positive train: source 223/104/104/69, scope 412/88, progressive/oracle 33/467.
    - {id: train_pos_big_atomic_progressive, split: train, filters: {label: 1, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.condition: progressive}, count: 12}
    - {id: train_pos_big_atomic_oracle, split: train, filters: {label: 1, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 123}
    - {id: train_pos_big_composite_oracle, split: train, filters: {label: 1, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.condition: oracle}, count: 88}
    - {id: train_pos_logic_progressive, split: train, filters: {label: 1, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.condition: progressive}, count: 10}
    - {id: train_pos_logic_oracle, split: train, filters: {label: 1, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 94}
    - {id: train_pos_med_progressive, split: train, filters: {label: 1, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.condition: progressive}, count: 11}
    - {id: train_pos_med_oracle, split: train, filters: {label: 1, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 93}
    - {id: train_pos_tool_oracle, split: train, filters: {label: 1, metadata.benchmark_source: toolqa, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 69}
    # Positive validation: source 45/21/21/13, scope 82/18, progressive/oracle 6/94.
    - {id: validation_pos_big_atomic_progressive, split: validation, filters: {label: 1, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.condition: progressive}, count: 2}
    - {id: validation_pos_big_atomic_oracle, split: validation, filters: {label: 1, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 25}
    - {id: validation_pos_big_composite_oracle, split: validation, filters: {label: 1, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.condition: oracle}, count: 18}
    - {id: validation_pos_logic_progressive, split: validation, filters: {label: 1, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.condition: progressive}, count: 2}
    - {id: validation_pos_logic_oracle, split: validation, filters: {label: 1, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 19}
    - {id: validation_pos_med_progressive, split: validation, filters: {label: 1, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.condition: progressive}, count: 2}
    - {id: validation_pos_med_oracle, split: validation, filters: {label: 1, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 19}
    - {id: validation_pos_tool_oracle, split: validation, filters: {label: 1, metadata.benchmark_source: toolqa, metadata.factor_scope: atomic, metadata.condition: oracle}, count: 13}
    # Negative train: exact source/scope marginals and semantic/progressive/no-skill 59/270/171.
    - {id: train_neg_big_atomic_semantic, split: train, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 27}
    - {id: train_neg_big_atomic_progressive, split: train, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 93}
    - {id: train_neg_big_atomic_no_skill, split: train, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.negative_type: no_skill}, count: 15}
    - {id: train_neg_big_composite_semantic, split: train, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.negative_type: semantic}, count: 1}
    - {id: train_neg_big_composite_progressive, split: train, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.negative_type: progressive_selection}, count: 50}
    - {id: train_neg_big_composite_no_skill, split: train, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.negative_type: no_skill}, count: 37}
    - {id: train_neg_logic_semantic, split: train, filters: {label: 0, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 3}
    - {id: train_neg_logic_progressive, split: train, filters: {label: 0, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 34}
    - {id: train_neg_logic_no_skill, split: train, filters: {label: 0, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.negative_type: no_skill}, count: 67}
    - {id: train_neg_med_semantic, split: train, filters: {label: 0, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 1}
    - {id: train_neg_med_progressive, split: train, filters: {label: 0, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 65}
    - {id: train_neg_med_no_skill, split: train, filters: {label: 0, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.negative_type: no_skill}, count: 38}
    - {id: train_neg_tool_semantic, split: train, filters: {label: 0, metadata.benchmark_source: toolqa, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 27}
    - {id: train_neg_tool_progressive, split: train, filters: {label: 0, metadata.benchmark_source: toolqa, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 28}
    - {id: train_neg_tool_no_skill, split: train, filters: {label: 0, metadata.benchmark_source: toolqa, metadata.factor_scope: atomic, metadata.negative_type: no_skill}, count: 14}
    # Negative validation: semantic/progressive/no-skill 12/54/34 and all source/scope marginals.
    - {id: validation_neg_big_atomic_semantic, split: validation, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 2}
    - {id: validation_neg_big_atomic_progressive, split: validation, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 15}
    - {id: validation_neg_big_atomic_no_skill, split: validation, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: atomic, metadata.negative_type: no_skill}, count: 10}
    - {id: validation_neg_big_composite_semantic, split: validation, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.negative_type: semantic}, count: 1}
    - {id: validation_neg_big_composite_progressive, split: validation, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.negative_type: progressive_selection}, count: 9}
    - {id: validation_neg_big_composite_no_skill, split: validation, filters: {label: 0, metadata.benchmark_source: bigcodebench, metadata.factor_scope: composite, metadata.negative_type: no_skill}, count: 8}
    - {id: validation_neg_logic_semantic, split: validation, filters: {label: 0, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 2}
    - {id: validation_neg_logic_progressive, split: validation, filters: {label: 0, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 11}
    - {id: validation_neg_logic_no_skill, split: validation, filters: {label: 0, metadata.benchmark_source: logicbench, metadata.factor_scope: atomic, metadata.negative_type: no_skill}, count: 8}
    - {id: validation_neg_med_semantic, split: validation, filters: {label: 0, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 1}
    - {id: validation_neg_med_progressive, split: validation, filters: {label: 0, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 12}
    - {id: validation_neg_med_no_skill, split: validation, filters: {label: 0, metadata.benchmark_source: medcalcbench, metadata.factor_scope: atomic, metadata.negative_type: no_skill}, count: 8}
    - {id: validation_neg_tool_semantic, split: validation, filters: {label: 0, metadata.benchmark_source: toolqa, metadata.factor_scope: atomic, metadata.negative_type: semantic}, count: 6}
    - {id: validation_neg_tool_progressive, split: validation, filters: {label: 0, metadata.benchmark_source: toolqa, metadata.factor_scope: atomic, metadata.negative_type: progressive_selection}, count: 7}

split:
  strategy: selection_partition_v1
  group_field: leakage_group_id

provenance:
  source_processing_config: ../datasets/capability_internal/skill_use/sra_bench/processing/train_scale.yaml
  generation_model: ${BASE_MODEL_ROOT}/models--deepseek-ai--DeepSeek-R1-0528-Qwen3-8B
  model: ${BASE_MODEL_ROOT}/models--deepseek-ai--DeepSeek-R1-0528-Qwen3-8B
  tokenizer: ${BASE_MODEL_ROOT}/models--deepseek-ai--DeepSeek-R1-0528-Qwen3-8B
  dataset_path: ../datasets/capability_internal/skill_use/sra_bench/data/canonical/records.jsonl
  split: leakage_group_disjoint_train_validation
  max_sequence_length: 65536
  truncation: fail_closed
  padding: not_applicable
  seed: 20260818
  evaluation_metric: target_skill_application_binary
  training_batch_size: not_applicable_dataset_construction
  batch_size: not_applicable_dataset_construction
  learning_rate: not_applicable_dataset_construction
  epochs_or_steps: not_applicable_dataset_construction
  optimizer: not_applicable_dataset_construction
  scheduler: not_applicable_dataset_construction

output:
  directory: ../artifacts/train/skill/sra_bench_skill_use
