# Frozen M1 Phase-1A formal run. This is the four-GPU owner config; the rjob
# world size is recorded at runtime and must be 4 for the intended global batch.
extends: train_phase1_engineering_smoke.yaml

monitor:
  backend_options:
    training_scope:
      mode: phase1_full
    repository_policy: allow_dirty_with_recorded_diff
    new_module_learning_rate: 0.0001
    label_weighting: none

optimization:
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00005
  epochs: null
  max_steps: 3162
  optimizer: adamw_torch
  scheduler: linear
  checkpoint_policy: steps
  weight_decay: 0.0
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  mixed_precision: bf16
  logging_steps: 10
  save_steps: 1054
  resume_from_checkpoint: null
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false

evaluation:
  metric: auroc
  cadence: 1054
  threshold_policy: select_on_validation
  early_stopping_patience: null

output:
  directory: ../runs/qwen35_4b_factor_binary_phase1
