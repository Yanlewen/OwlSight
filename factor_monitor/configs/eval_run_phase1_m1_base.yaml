# Shared formal inference contract for the preserved Phase-1 M1 model.
# Dataset, metric, and output ownership remain in thin benchmark configs.
schema_version: 1
kind: eval_run

model:
  checkpoint: ${BASE_MODEL_ROOT}/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  checkpoint_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  tokenizer: ${BASE_MODEL_ROOT}/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  tokenizer_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  load_options:
    trust_remote_code: true
    local_files_only: true
    attn_implementation: sdpa
    torch_dtype: bfloat16
    device_map: null

monitor:
  backend: factor_monitor_binary
  backend_options:
    architecture_config: architecture_factor_monitor.yaml
    factor_encoding_contract_id: factor_encoding_contract_v1
    evidence_encoding_contract_id: evidence_encoding_contract_v1
    evidence_routes:
      reasoning_method: cot_direct
      deception: cot_direct
      memory_use: context_grounded
      skill_use: context_grounded
      sycophancy: context_grounded
    sequence:
      max_factor_tokens: 1024
      length_buckets: [8192, 16384, 32768, 49152, 65536, 98304]
      overlength_policy: exclude_to_phase2
    batching:
      trajectories_per_microbatch: 1
      max_queries_per_trajectory: null
      mixed_route_policy: route_masked_vectorized
      distributed_unused_route_policy: find_unused_parameters_true
    repository_policy: allow_dirty_with_recorded_diff
    evaluation_scope:
      mode: formal
    model_bundle: ../runs/qwen35_4b_factor_binary_phase1/model_bundle

runtime:
  max_sequence_length: 98304
  truncation_policy: error
  padding_policy: dynamic_right
  seed: 0
  batch_size: 1

evaluation:
  threshold_policy: frozen_validation
  threshold_source: ../runs/qwen35_4b_factor_binary_phase1/validation_threshold.json
