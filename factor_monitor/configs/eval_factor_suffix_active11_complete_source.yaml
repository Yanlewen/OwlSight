schema_version: 1
kind: factor_monitor_full_eval
suite_id: factor_suffix_active11_complete_source

# This is a reusable template.  `full-eval materialize` binds the model,
# tokenizer, threshold and output root to one immutable training run before
# any worker is submitted.
model:
  model_bundle: __MODEL_OUTPUT_REQUIRED__
  threshold_source: __MODEL_OUTPUT_REQUIRED__
  tokenizer: __MODEL_OUTPUT_REQUIRED__
  architecture: architecture_factor_monitor_trustworthiness13.yaml
window:
  max_endpoint_tokens: 32768
  overlap_tokens: 6144
  truncation_policy: error
  context_policy: repeat_full_when_feasible_else_window_context
  primary_pooling: top2_mean
  diagnostic_pooling: [max, top2_logmeanexp, noisy_or]
coverage:
  source_unit: query
  partition_policy: exact_disjoint_union
  overlength_policy: lossless_windows
  formal_eval: complete_source_only
metric_policy:
  formal_metric: gmean2
  threshold_rule: score >= frozen_threshold
  threshold_source: validation_threshold.json
benchmarks:
  - &partitioned
    id: aime
    mode: partitioned
    parent_config: eval_run_trust4_suffix_{benchmark}.yaml
    source_directory: ../artifacts/eval/process/openai_process_aime
    source_audit: ../runs/audits/eval_active11_32768/{benchmark}.json
    accepted_directory: ../artifacts/eval_complete_views_active11_32768/{benchmark}/accepted
    overlength_directory: ../artifacts/eval_complete_views_active11_32768/{benchmark}/overlength
    direct_scores: __BOUND_OUTPUT_REQUIRED__
    window_scores: __BOUND_OUTPUT_REQUIRED__
    output_directory: __BOUND_OUTPUT_REQUIRED__
  - {<<: *partitioned, id: gpqa, source_directory: ../artifacts/eval/process/openai_process_gpqa}
  - {<<: *partitioned, id: mask_qwen, source_directory: ../artifacts/eval/deception/mask_qwen3_8b}
  - {<<: *partitioned, id: sycobench_judge, source_directory: ../artifacts/eval/sycophancy/sycobench_600/judge_influence}
  - {<<: *partitioned, id: skilleval, source_directory: ../artifacts/eval/skill/skilleval_v1/deepseek_v4_flash_eval/monitor_manifest}
  - {<<: *partitioned, id: reward_hacking, source_directory: ../artifacts/eval/reward_hacking/malt_reward_hacking_reviewed}
  - {<<: *partitioned, id: sabotage, source_directory: ../artifacts/eval/sabotage/shadearena_benign_vs_aware_b/monitor_manifest}
  - {<<: *partitioned, id: sandbagging, source_directory: ../artifacts/eval/sandbagging/malt_sandbagging_clean}
  - {<<: *partitioned, id: ifbench, parent_config: eval_run_trust4_suffix_ifbench_final_outcome.yaml, source_directory: ../artifacts/eval/instruction_following/ifbench_official_test_outcome/monitor_manifest}
  - {<<: *partitioned, id: hallulens, source_directory: ../artifacts/eval/hallucination/hallulens_nonexistent_refusal}
  - {<<: *partitioned, id: confaide, source_directory: ../artifacts/eval/privacy/confaide}
  - {<<: *partitioned, id: jailbreakbench, source_directory: ../artifacts/eval/jailbreak/jailbreakbench}
  - id: openai_sycophancy
    mode: full_context
    parent_config: eval_run_trust4_suffix_openai_sycophancy.yaml
    direct_scores: __BOUND_OUTPUT_REQUIRED__
    output_directory: __BOUND_OUTPUT_REQUIRED__
  - id: openai_wmdp
    mode: full_context
    parent_config: eval_run_trust4_suffix_openai_wmdp.yaml
    direct_scores: __BOUND_OUTPUT_REQUIRED__
    output_directory: __BOUND_OUTPUT_REQUIRED__
output:
  directory: __BOUND_OUTPUT_REQUIRED__
