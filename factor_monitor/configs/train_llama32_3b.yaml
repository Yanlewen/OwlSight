  checkpoint_revision: 13afe5124825b4f3751f836b40dafda64c1ed062
  tokenizer: ${BASE_MODEL_ROOT}/models--meta-llama--Llama-3.2-3B
  tokenizer_revision: 13afe5124825b4f3751f836b40dafda64c1ed062
  load_options:
    trust_remote_code: true
    local_files_only: true
    attn_implementation: sdpa
    torch_dtype: bfloat16
    device_map: null
    pad_token: <|finetune_right_pad_id|>
monitor:
  backend: factor_monitor_binary
  backend_options:
    architecture_config: architecture_llama32_3b.yaml
    factor_encoding_contract_id: factor_encoding_contract_v1
    evidence_encoding_contract_id: evidence_encoding_contract_v1
    evidence_routes:
      reasoning_method: cot_direct
      deception: cot_direct
      memory_use: context_grounded
      skill_use: context_grounded
      sycophancy: context_grounded
      reward_hacking: cot_direct
      sabotage: cot_direct
      sandbagging: context_grounded
      instruction_following: context_grounded
      hallucination: context_grounded
      bias: context_grounded
      privacy: context_grounded
      jailbreak: context_grounded
    training_scope:
      mode: smoke_subset
      families:
      - reasoning_method
      - deception
      - skill_use
      - sycophancy
      - reward_hacking
      - sabotage
      - sandbagging
      - instruction_following
      - hallucination
      - privacy
      - jailbreak
    sequence:
      max_factor_tokens: 512
      length_buckets:
      - 8192
      - 16384
      - 24576
      - 32768
      - 33024
      overlength_policy: window_complete_no_truncation
    batching:
      training_unit: long_cot_mil
      trajectories_per_microbatch: 1
      max_queries_per_trajectory: null
      mixed_route_policy: route_masked_vectorized
      distributed_unused_route_policy: sampler_guaranteed_per_synchronized_step
    repository_policy: allow_dirty_with_recorded_diff
    lora:
      target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      rank: 16
      alpha: 32
      dropout: 0.05
      bias: none
    new_module_learning_rate: 0.0001
    label_weighting: record_loss_weight
    loss_aggregation: mil_factor_instance_uniform
    model_variant: endpoint_early_fusion
    endpoint_encoding_contract_id: endpoint_factor_suffix_contract_v1
