# M0 single-delta ablation: add zero-initialized semantic-field role embeddings.
extends: train_phase1_m0_endpoint.yaml

monitor:
  backend_options:
    endpoint_role_embedding:
      enabled: true
      field_order: [factor, relation, applied, not_applied, context, cot]
      initialization: zeros
      application: field_content_tokens_only
      structural_tokens: zero
    batching:
      trajectories_per_microbatch: 2
      distributed_unused_route_policy: sampler_guaranteed_per_synchronized_step

runtime:
  expected_world_size: 2

optimization:
  batch_size: 2

output:
  directory: ../runs/qwen35_4b_factor_binary_phase1_role_embed
