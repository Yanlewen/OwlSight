# Engineering-only CUDA/DDP gate for the joint-backbone M1 path. It preserves
# the formal experiment inputs and optimizer settings but stops after 10 steps,
# then runs the complete distributed validation and bundle round trip.
extends: train_phase1_joint_encoding_evidence_readout.yaml

optimization:
  max_steps: 10
  logging_steps: 1
  save_steps: 10
  warmup_ratio: 0.0

evaluation:
  cadence: 10

output:
  directory: ../runs/qwen35_4b_factor_binary_phase1_joint_encoding_gate
