schema_version: 1
kind: factor_monitor_full_eval
suite_id: factor_suffix_near_ood_deception

# Reusable two-source replacement suite.  `full-eval materialize` binds the
# model bundle, tokenizer, frozen threshold, and isolated output root.
model:
  model_bundle: __MODEL_OUTPUT_REQUIRED__
  threshold_source: __MODEL_OUTPUT_REQUIRED__
  tokenizer: __MODEL_OUTPUT_REQUIRED__
  architecture: architecture_factor_monitor_trustworthiness13.yaml
window:
  max_endpoint_tokens: 32768
  overlap_tokens: 6144
  truncation_policy: error
  context_policy: repeat_full_when_feasible_else_window_context
  primary_pooling: top2_mean
  diagnostic_pooling: [max, top2_logmeanexp, noisy_or]
coverage:
  source_unit: query
  partition_policy: exact_disjoint_union
  overlength_policy: lossless_windows
  formal_eval: complete_source_only
metric_policy:
  formal_metric: gmean2
  threshold_rule: score >= frozen_threshold
  threshold_source: validation_threshold.json
benchmarks:
  - id: pku_deceptionbench
    mode: partitioned
    parent_config: eval_run_trust4_suffix_pku_deceptionbench.yaml
    source_directory: ../artifacts/eval/deception/pku_deceptionbench
    source_audit: ../runs/audits/eval_near_ood_deception_32768/pku_deceptionbench.json
    accepted_directory: ../artifacts/eval_complete_views_near_ood_deception_32768/pku_deceptionbench/accepted
    overlength_directory: ../artifacts/eval_complete_views_near_ood_deception_32768/pku_deceptionbench/overlength
    direct_scores: __BOUND_OUTPUT_REQUIRED__
    window_scores: __BOUND_OUTPUT_REQUIRED__
    output_directory: __BOUND_OUTPUT_REQUIRED__
  - id: apollo_roleplaying
    mode: partitioned
    parent_config: eval_run_trust4_suffix_apollo_roleplaying.yaml
    source_directory: ../artifacts/eval/deception/apollo_roleplaying
    source_audit: ../runs/audits/eval_near_ood_deception_32768/apollo_roleplaying.json
    accepted_directory: ../artifacts/eval_complete_views_near_ood_deception_32768/apollo_roleplaying/accepted
    overlength_directory: ../artifacts/eval_complete_views_near_ood_deception_32768/apollo_roleplaying/overlength
    direct_scores: __BOUND_OUTPUT_REQUIRED__
    window_scores: __BOUND_OUTPUT_REQUIRED__
    output_directory: __BOUND_OUTPUT_REQUIRED__
output:
  directory: __BOUND_OUTPUT_REQUIRED__
