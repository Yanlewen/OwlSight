# Joint-backbone ablation: preserve the completed A4 Evidence Readout model
# structure and training budget, but encode Factor, Relation, criteria, Context,
# and CoT together once per query so Evidence hidden states are Factor-conditioned.
extends: train_phase1_factor_pool_criterion_margin_isolated_queries_evidence_readout.yaml

monitor:
  backend_options:
    model_variant: factor_joint_fusion
    joint_encoding_contract_id: endpoint_early_fusion_contract_v1
    joint_length_audit: ../runs/audits/qwen35_4b_factor_binary_phase1_endpoint_length.json
    joint_max_padded_tokens_per_backbone_forward: 33024
    sequence:
      length_buckets: [8192, 16384, 24576, 32768, 33024]

runtime:
  max_sequence_length: 33024

output:
  directory: ../runs/qwen35_4b_factor_binary_phase1_joint_encoding_evidence_readout
