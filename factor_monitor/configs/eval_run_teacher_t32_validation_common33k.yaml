# T32 scoring over the frozen all-length validation windows.
extends: eval_run_factor9_suffix_aime.yaml

dataset:
  directory: ../artifacts/train/combined/harp_syc_m0_risk_if_all_lengths
  trajectory_file: trajectories.jsonl
  query_file: validation_queries.jsonl

monitor:
  backend_options:
    endpoint_length_audit: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_mil_length.json
    endpoint_max_padded_tokens_per_backbone_forward: 33024
    sequence:
      max_factor_tokens: 512
      overlength_policy: exclude_to_phase2
      length_buckets: [8192, 16384, 24576, 32768, 33024]
    evaluation_scope:
      mode: formal
      long_cot_windowing:
        enabled: true
        comparison_mode: teacher_window_audit
        trigger_endpoint_tokens: 33024
        max_endpoint_tokens: 33024
        cot_overlap_tokens: 6144
        context_policy: repeat_full_when_feasible_else_window_context
        overlap_fallback_policy: half_field_capacity_when_needed
        coverage_policy: complete_no_truncation
        selection_unit: trajectory_any_query_over_trigger
        aggregations: [top2_mean, top2_logmeanexp]
        frozen_window_manifest: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_mil_pmean/mil_validation_window_manifest.json

runtime:
  batch_size: 2
  max_sequence_length: 33024

evaluation:
  metric: auroc

output:
  directory: ../runs/eval/qwen35_4b_factor_binary_harp_syc_m0_risk_if_factor_suffix/teacher_window_common33k/validation/inference
