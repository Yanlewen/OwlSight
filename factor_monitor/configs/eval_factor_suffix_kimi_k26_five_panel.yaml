schema_version: 1
kind: factor_monitor_full_eval
suite_id: factor_suffix_kimi_k26_five_panel

# Reusable Kimi K2.6 five-panel template.  `full-eval materialize` binds the
# model bundle, tokenizer, frozen threshold, and isolated output root.
# Panels match the GLM-5.3-Flash mil-11 suite: Process AIME/GPQA, SkillEval,
# SycoBench-600, and IFBench.  Source directories are the isolated Kimi
# artifacts, not GLM or the historical DeepSeek Process copies.
model:
  model_bundle: __MODEL_OUTPUT_REQUIRED__
  threshold_source: __MODEL_OUTPUT_REQUIRED__
  tokenizer: __MODEL_OUTPUT_REQUIRED__
  architecture: architecture_factor_monitor_trustworthiness13.yaml
window:
  max_endpoint_tokens: 32768
  overlap_tokens: 6144
  truncation_policy: error
  context_policy: repeat_full_when_feasible_else_window_context
  primary_pooling: top2_mean
  diagnostic_pooling: [max, top2_logmeanexp, noisy_or]
coverage:
  source_unit: query
  partition_policy: exact_disjoint_union
  overlength_policy: lossless_windows
  formal_eval: complete_source_only
metric_policy:
  formal_metric: gmean2
  threshold_rule: score >= frozen_threshold
  threshold_source: validation_threshold.json
benchmarks:
  - &partitioned
    id: aime
    mode: partitioned
    parent_config: eval_run_trust4_suffix_{benchmark}.yaml
    source_directory: ../artifacts/kimi-k2.6/process/openai_process/aime
    source_audit: ../runs/audits/eval_kimi_k26_five_panel_32768/{benchmark}.json
    accepted_directory: ../artifacts/eval_complete_views_kimi_k26_five_panel_32768/{benchmark}/accepted
    overlength_directory: ../artifacts/eval_complete_views_kimi_k26_five_panel_32768/{benchmark}/overlength
    direct_scores: __BOUND_OUTPUT_REQUIRED__
    window_scores: __BOUND_OUTPUT_REQUIRED__
    output_directory: __BOUND_OUTPUT_REQUIRED__
  - {<<: *partitioned, id: gpqa, source_directory: ../artifacts/kimi-k2.6/process/openai_process/gpqa}
  - {<<: *partitioned, id: skilleval, source_directory: ../artifacts/eval/skill/skilleval_v1/kimi_k26_api_eval/monitor_manifest}
  - {<<: *partitioned, id: sycobench, parent_config: eval_run_trust4_suffix_sycobench_judge.yaml, source_directory: ../artifacts/eval/sycophancy/sycobench_600_kimi_k26/judge_influence}
  - {<<: *partitioned, id: ifbench, parent_config: eval_run_trust4_suffix_ifbench.yaml, source_directory: ../artifacts/eval/instruction_following/ifbench_official_test_kimi_k26}
output:
  directory: __BOUND_OUTPUT_REQUIRED__
