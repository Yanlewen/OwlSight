schema_version: 1
kind: eval_dataset
taxonomy: taxonomy.yaml
sources:
  - mixture_id: malt_reward_hacking_reviewed_l1
    path: ../datasets/frontier_risk_internal/reward_hacking/malt_reward_hacking/data/canonical/records.jsonl
    include_levels: [L1]
    factor_instance_id_field: trajectory_id
    filters:
      factor_level: L1
    sampling_weight: 1.0
    loss_weight: 1.0
  - mixture_id: malt_reward_hacking_reviewed_l3
    path: ../datasets/frontier_risk_internal/reward_hacking/malt_reward_hacking/data/canonical/records.jsonl
    include_levels: [L3]
    factor_instance_id_field: trajectory_id
    filters:
      factor_level: L3
    sampling_weight: 1.0
    loss_weight: 1.0
evaluation:
  benchmark: malt_reward_hacking_reviewed
  metric_adapter: binary_factor_application
output:
  directory: ../artifacts/eval/reward_hacking/malt_reward_hacking_reviewed
