schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: harp_reasoning_method_factor_contrast
    path: ../datasets/capability_internal/reasoning_method/harp/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: factor_contrast
  unit_field: metadata.factor_instance_id
  seed: 20260818
  max_attempts: 4096
  required_levels: [L1, L3]
  passthrough_splits: []
  report_fields:
    - metadata.factor_contrast.role
    - metadata.factor_contrast.factor_scope
    - metadata.factor_contrast.selection_tier
    - metadata.factor_contrast.negative_type
    - metadata.source_partition
    - metadata.source_subject
  coverage:
    - {split: train, field: metadata.source_subject, values: [algebra, counting_and_probability, geometry, number_theory, prealgebra, precalculus]}
    - {split: validation, field: metadata.source_subject, values: [algebra, counting_and_probability, geometry, number_theory, prealgebra, precalculus]}
  strata:
    - {id: train_primary_composite, split: train, priority: 0, filters: {unit.factor_scope: composite, unit.selection_tier: primary}, count: 150}
    - {id: train_primary_atomic, split: train, priority: 1, filters: {unit.factor_scope: atomic, unit.selection_tier: primary}, count: 350}
    - {id: validation_primary_composite, split: validation, priority: 0, filters: {unit.factor_scope: composite, unit.selection_tier: primary}, count: 25}
    - {id: validation_primary_atomic, split: validation, priority: 1, filters: {unit.factor_scope: atomic, unit.selection_tier: primary}, count: 71}
    - {id: validation_secondary_atomic, split: validation, priority: 2, filters: {unit.factor_scope: atomic, unit.selection_tier: secondary}, count: 4}

split:
  strategy: metadata_partition_v1
  field: metadata.source_partition
  train_value: train
  validation_value: validation
  holdout_value: test

provenance:
  source_processing_config: ../datasets/capability_internal/reasoning_method/harp/processing/config.yaml
  dataset_path: ../datasets/capability_internal/reasoning_method/harp/data/canonical/records.jsonl
  model: not_applicable_dataset_construction
  tokenizer: not_applicable_pre_tokenization
  split: original_source_partition_factor_contrast
  max_sequence_length: unbounded_complete_cot
  truncation: prohibited
  padding: not_applicable
  batch_size: not_applicable_dataset_construction
  learning_rate: not_applicable_dataset_construction
  epochs_or_steps: not_applicable_dataset_construction
  optimizer: not_applicable_dataset_construction
  scheduler: not_applicable_dataset_construction
  seed: 20260818
  evaluation_metric: within_trajectory_reasoning_method_contrast

output:
  directory: ../artifacts/train/process/method_application_harp_contrast
