# Ten-step two-H200 native-65k integration gate for the nine-family Factor-Suffix run.
extends: train_m0_harp_syc_m0_risk_if_factor_suffix_gate.yaml

dataset:
  directory: ../artifacts/train/combined/harp_syc_m0_risk_if_65k
  manifest: effective_config.json
  trajectory_file: trajectories.jsonl
  train_file: train_queries.jsonl
  validation_file: validation_queries.jsonl
  holdout_file: holdout_queries.jsonl

monitor:
  backend_options:
    endpoint_length_audit: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_factor_suffix_65k_length.json
    endpoint_max_padded_tokens_per_backbone_forward: 66048
    sequence:
      max_factor_tokens: 512
      overlength_policy: exclude_to_phase2
      length_buckets: [8192, 16384, 24576, 32768, 49152, 65536, 66048]

runtime:
  expected_world_size: 2
  max_sequence_length: 66048

output:
  directory: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_factor_suffix_65k_gate
