# P0 control: frozen pair_0827 data with the historical trajectory sampler/loss.
extends: train_phase1_m0_endpoint.yaml

dataset:
  directory: ../artifacts/train/combined/pair_0827/evidence_le_32768
  manifest: effective_config.json
  trajectory_file: trajectories.jsonl
  train_file: train_queries.jsonl
  validation_file: validation_queries.jsonl
  holdout_file: holdout_queries.jsonl

monitor:
  backend_options:
    endpoint_length_audit: ../runs/qwen35_4b_factor_binary_contrast4_endpoint_length.json
    batching:
      training_unit: trajectory
      trajectories_per_microbatch: 2
      distributed_unused_route_policy: sampler_guaranteed_per_synchronized_step
    loss_aggregation: trajectory_hierarchical

runtime:
  expected_world_size: 2
  max_sequence_length: 33024

optimization:
  batch_size: 2

output:
  directory: ../runs/qwen35_4b_factor_binary_contrast4_trajectory
