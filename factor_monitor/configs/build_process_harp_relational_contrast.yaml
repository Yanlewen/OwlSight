schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml

sources:
  - mixture_id: harp_reasoning_method_factor_relational_contrast
    path: ../datasets/capability_internal/reasoning_method/harp/data/canonical/records.jsonl
    include_levels: [L1, L3]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: metadata.factor_instance_id

selection:
  strategy: partitioned_group_quota_v1
  unit_mode: factor_mixed_contrast
  unit_field: metadata.factor_instance_id
  seed: 20260818
  max_attempts: 4096
  required_levels: [L1, L3]
  passthrough_splits: []
  resource_capacities:
    train: {trajectory: 1, factor_instance: 1}
    validation: {trajectory: 2, factor_instance: 1}
  minimum_distinct_resources:
    train: {trajectory: 750}
    validation: {trajectory: 114}
  report_fields:
    - metadata.factor_contrast.contract_id
    - metadata.factor_contrast.contrast_axis
    - metadata.factor_contrast.role
    - metadata.factor_contrast.factor_scope
    - metadata.factor_contrast.negative_type
    - metadata.source_partition
    - metadata.source_subject
  coverage:
    - {split: train, field: metadata.source_subject, values: [algebra, counting_and_probability, geometry, number_theory, prealgebra, precalculus]}
    - {split: validation, field: metadata.source_subject, values: [algebra, counting_and_probability, geometry, number_theory, prealgebra, precalculus]}
  strata:
    # Train Factor axis: Atomic 175, Composite 75.
    - {id: tr_fa_alg, split: train, priority: 5, filters: {unit.contrast_axis: factor, unit.factor_scope: atomic, metadata.source_subject: algebra}, count: 43}
    - {id: tr_fa_cnt, split: train, priority: 5, filters: {unit.contrast_axis: factor, unit.factor_scope: atomic, metadata.source_subject: counting_and_probability}, count: 37}
    - {id: tr_fa_geo, split: train, priority: 5, filters: {unit.contrast_axis: factor, unit.factor_scope: atomic, metadata.source_subject: geometry}, count: 54}
    - {id: tr_fa_num, split: train, priority: 5, filters: {unit.contrast_axis: factor, unit.factor_scope: atomic, metadata.source_subject: number_theory}, count: 20}
    - {id: tr_fa_pre, split: train, priority: 5, filters: {unit.contrast_axis: factor, unit.factor_scope: atomic, metadata.source_subject: prealgebra}, count: 2}
    - {id: tr_fa_cal, split: train, priority: 5, filters: {unit.contrast_axis: factor, unit.factor_scope: atomic, metadata.source_subject: precalculus}, count: 19}
    - {id: tr_fc_alg, split: train, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: algebra}, count: 21}
    - {id: tr_fc_cnt, split: train, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: counting_and_probability}, count: 20}
    - {id: tr_fc_geo, split: train, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: geometry}, count: 18}
    - {id: tr_fc_num, split: train, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: number_theory}, count: 8}
    - {id: tr_fc_pre, split: train, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: prealgebra}, count: 2}
    - {id: tr_fc_cal, split: train, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: precalculus}, count: 6}

    # Train Evidence axis: Atomic 175, Composite 75. Composite subtype is explicit.
    - {id: tr_ea_alg, split: train, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: algebra}, count: 50}
    - {id: tr_ea_cnt, split: train, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: counting_and_probability}, count: 35}
    - {id: tr_ea_geo, split: train, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: geometry}, count: 46}
    - {id: tr_ea_num, split: train, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: number_theory}, count: 22}
    - {id: tr_ea_pre, split: train, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: prealgebra}, count: 2}
    - {id: tr_ea_cal, split: train, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: precalculus}, count: 20}
    - {id: tr_ec_alg_alt, split: train, priority: 2, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: alternative_path_negative, metadata.source_subject: algebra}, count: 10}
    - {id: tr_ec_alg_par, split: train, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: algebra}, count: 13}
    - {id: tr_ec_alg_abs, split: train, priority: 0, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: fully_absent_negative, metadata.source_subject: algebra}, count: 2}
