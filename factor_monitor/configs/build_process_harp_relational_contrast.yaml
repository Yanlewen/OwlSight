    - {id: va_fa_cal, split: validation, priority: 5, filters: {unit.contrast_axis: factor, unit.factor_scope: atomic, metadata.source_subject: precalculus}, count: 7}
    - {id: va_fc_alg, split: validation, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: algebra}, count: 3}
    - {id: va_fc_cnt, split: validation, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: counting_and_probability}, count: 2}
    - {id: va_fc_geo, split: validation, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: geometry}, count: 1}
    - {id: va_fc_num, split: validation, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: number_theory}, count: 4}
    - {id: va_fc_pre, split: validation, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: prealgebra}, count: 1}
    - {id: va_fc_cal, split: validation, priority: 4, filters: {unit.contrast_axis: factor, unit.factor_scope: composite, metadata.source_subject: precalculus}, count: 1}
    - {id: va_ea_alg, split: validation, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: algebra}, count: 9}
    - {id: va_ea_cnt, split: validation, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: counting_and_probability}, count: 7}
    - {id: va_ea_geo, split: validation, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: geometry}, count: 6}
    - {id: va_ea_num, split: validation, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: number_theory}, count: 8}
    - {id: va_ea_pre, split: validation, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: prealgebra}, count: 1}
    - {id: va_ea_cal, split: validation, priority: 3, filters: {unit.contrast_axis: evidence, unit.factor_scope: atomic, metadata.source_subject: precalculus}, count: 6}
    - {id: va_ec_alg_alt, split: validation, priority: 2, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: alternative_path_negative, metadata.source_subject: algebra}, count: 2}
    - {id: va_ec_alg_par, split: validation, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: algebra}, count: 2}
    - {id: va_ec_cnt_par, split: validation, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: counting_and_probability}, count: 2}
    - {id: va_ec_geo_alt, split: validation, priority: 2, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: alternative_path_negative, metadata.source_subject: geometry}, count: 1}
    - {id: va_ec_geo_par, split: validation, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: geometry}, count: 1}
    - {id: va_ec_num_alt, split: validation, priority: 2, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: alternative_path_negative, metadata.source_subject: number_theory}, count: 1}
