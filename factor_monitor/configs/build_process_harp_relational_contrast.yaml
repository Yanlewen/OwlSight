    - {id: tr_ec_geo_alt, split: train, priority: 2, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: alternative_path_negative, metadata.source_subject: geometry}, count: 5}
    - {id: tr_ec_geo_par, split: train, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: geometry}, count: 7}
    - {id: tr_ec_geo_abs, split: train, priority: 0, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: fully_absent_negative, metadata.source_subject: geometry}, count: 1}
    - {id: tr_ec_num_alt, split: train, priority: 2, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: alternative_path_negative, metadata.source_subject: number_theory}, count: 4}
    - {id: tr_ec_num_par, split: train, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: number_theory}, count: 5}
    - {id: tr_ec_num_abs, split: train, priority: 0, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: fully_absent_negative, metadata.source_subject: number_theory}, count: 1}
    - {id: tr_ec_pre_par, split: train, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: prealgebra}, count: 1}
    - {id: tr_ec_pre_abs, split: train, priority: 0, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: fully_absent_negative, metadata.source_subject: prealgebra}, count: 1}
    - {id: tr_ec_cal_alt, split: train, priority: 2, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: alternative_path_negative, metadata.source_subject: precalculus}, count: 5}
    - {id: tr_ec_cal_par, split: train, priority: 1, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: partial_path_negative, metadata.source_subject: precalculus}, count: 3}
    - {id: tr_ec_cal_abs, split: train, priority: 0, filters: {unit.contrast_axis: evidence, unit.factor_scope: composite, unit.negative_type: fully_absent_negative, metadata.source_subject: precalculus}, count: 1}

    # Validation Factor and Evidence axes.
