# Formal active-11 all-length metric-weighted Joint MIL run on Llama-3.2-3B.
# Reuses the validated Llama two-H200 gate and changes only the formal
# training/evaluation cadence.
extends: train_llama32_3b_active11_mil_gate.yaml

optimization:
  epochs: 3
  max_steps: null
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: auto

evaluation:
  cadence: auto
  during_training: false

output:
  directory: ../runs/llama32_3b_active11_mil_metric
