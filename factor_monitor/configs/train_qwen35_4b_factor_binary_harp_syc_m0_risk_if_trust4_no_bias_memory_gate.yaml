# Ten-step two-H200 gate for the 11-family bias/memory data ablation.
extends: train_qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_suffix_lora_gate.yaml

dataset:
  directory: ../artifacts/train/combined/harp_syc_m0_risk_if_trust4_no_bias_memory/unpartitioned
  manifest: effective_config.json
  trajectory_file: trajectories.jsonl
  train_file: train_queries.jsonl
  validation_file: validation_queries.jsonl
  holdout_file: holdout_queries.jsonl

monitor:
  backend_options:
    endpoint_length_audit: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_gate_length.json
    training_scope:
      mode: smoke_subset
      families:
        - reasoning_method
        - deception
        - skill_use
        - sycophancy
        - reward_hacking
        - sabotage
        - sandbagging
        - instruction_following
        - hallucination
        - privacy
        - jailbreak

optimization:
  max_steps: 10
  warmup_ratio: 0.0
  logging_steps: 1
  save_steps: 10

evaluation:
  cadence: 10
  metric: auroc

output:
  directory: ../runs/qwen35_4b_factor_binary_harp_syc_m0_risk_if_trust4_no_bias_memory_gate
