schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml
sources:
  - mixture_id: mem2act_memory_hard_focused_l1
    path: ../datasets/capability_internal/memory_use/mem2actbench/data/canonical/records.jsonl
    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
selection:
  strategy: metadata_stratified_cap_v1
  field: metadata.training_subtype
  unit_field: trajectory_id
  seed: 20260809
  caps:
    positive: 612
    hard_negative: 408
    simple_negative: 204
split:
  strategy: unsplit_pool_v1
output:
  directory: ../artifacts/train/memory/hard_focused/mem2act_memory_hard_focused_l1
