# Ten-step gate for MIL Joint with targeted metric-driven family reweighting.
# This is a fresh-base candidate; it does not resume active11_mil_metric.
extends: train_qwen35_4b_active11_mil_metric_gate.yaml

monitor:
  backend_options:
    metric_driven_weighting:
      # Relative multipliers are applied to the current MIL family weights and
      # renormalized over observed training families to mean one.
      family_sampling_overrides:
        skill_use: 1.5
        reward_hacking: 1.5
        sycophancy: 1.4
        instruction_following: 1.3
      # Reward Hacking L1 has materially less training mass than L3.
      level_loss_overrides:
        reward_hacking: {L1: 1.5, L3: 0.5}

output:
  directory: ../runs/qwen35_4b_active11_mil_metric_targeted_gate
