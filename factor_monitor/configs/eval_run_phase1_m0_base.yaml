# Shared formal inference contract for the preserved Phase-1 M0 endpoint baseline.
# Dataset-bound endpoint audits and output ownership remain in thin benchmark configs.
extends: eval_run_phase1_m1_base.yaml

monitor:
  backend_options:
    model_variant: endpoint_early_fusion
    endpoint_encoding_contract_id: endpoint_early_fusion_contract_v1
    endpoint_max_padded_tokens_per_backbone_forward: 98304
    sequence:
      max_factor_tokens: 512
      length_buckets: [8192, 16384, 32768, 49152, 65536, 98304]
    model_bundle: ../runs/qwen35_4b_factor_binary_phase1_endpoint/model_bundle

evaluation:
  threshold_source: ../runs/qwen35_4b_factor_binary_phase1_endpoint/validation_threshold.json
