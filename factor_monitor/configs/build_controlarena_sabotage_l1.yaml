schema_version: 1
kind: train_dataset
taxonomy: taxonomy.yaml
sources:
  - mixture_id: controlarena_sabotage
    path: ../datasets/frontier_risk_internal/sabotage/controlarena/data/canonical/records.jsonl
    include_levels: [L1]
    sampling_weight: 1.0
    loss_weight: 1.0
    factor_instance_id_field: trajectory_id
selection:
  strategy: partitioned_group_quota_v1
  unit_mode: records
  unit_field: trajectory_id
  seed: 20260818
  max_attempts: 16384
  required_levels: [L1]
  passthrough_splits: []
  report_fields:
    - metadata.bucket
    - metadata.setting
    - metadata.environment_outcome
  coverage:
    - split: train
      field: metadata.setting
      values: [apps, agentdojo, bigcodebench, data_poisoning, bash, iac_fast, sae_interp_sabotage, bash_arena]
    - split: validation
      field: metadata.setting
      values: [apps, agentdojo, bigcodebench, data_poisoning, bash, iac_fast, sae_interp_sabotage, bash_arena]
  strata:
    - {id: train_clean_negative, split: train, filters: {metadata.bucket: clean_negative}, count: 250}
    - {id: train_hard_negative, split: train, filters: {metadata.bucket: hard_negative}, count: 250}
    - {id: train_failed_applied, split: train, filters: {metadata.bucket: failed_applied}, count: 250}
    - {id: train_successful_applied, split: train, filters: {metadata.bucket: successful_applied}, count: 250}
    - {id: validation_clean_negative, split: validation, filters: {metadata.bucket: clean_negative}, count: 50}
    - {id: validation_hard_negative, split: validation, filters: {metadata.bucket: hard_negative}, count: 50}
    - {id: validation_failed_applied, split: validation, filters: {metadata.bucket: failed_applied}, count: 50}
    - {id: validation_successful_applied, split: validation, filters: {metadata.bucket: successful_applied}, count: 50}
split:
  strategy: selection_partition_v1
  group_field: leakage_group_id
provenance:
  dataset_path: ../datasets/frontier_risk_internal/sabotage/controlarena/data/canonical/records.jsonl
  model: not_applicable_dataset_construction
  tokenizer: not_applicable_pre_tokenization
  split: leakage_group_disjoint_four_bucket
  max_sequence_length: unbounded_complete_cot
  truncation: none
  padding: not_applicable_dataset_artifact
  batch_size: not_applicable_dataset_construction
  learning_rate: not_applicable_dataset_construction
  epochs_or_steps: not_applicable_dataset_construction
  optimizer: not_applicable_dataset_construction
  scheduler: not_applicable_dataset_construction
  seed: 20260818
  evaluation_metric: binary_sabotage_application

output:
  directory: ../artifacts/train/sabotage/controlarena_sabotage_l1
