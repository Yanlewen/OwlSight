schema_version: 1
kind: factor_judge_profile
profile_id: gpt_5_4_low_reasoning_judge
model: gpt-5.4

request:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  extra_body:
    reasoning_effort: low

transport:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  workers: 8
  retries: 2
  timeout_seconds: 180
  checkpoint_every: 1

response:
  require_content: true
  forbid_reasoning: false
